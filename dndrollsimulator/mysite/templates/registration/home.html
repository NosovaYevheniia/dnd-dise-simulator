
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D - Home</title>

    <style>
        body {
            background: linear-gradient(135deg, #241333, #4b286d);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px 30px 260px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 230px;
            height: 100vh;
            background: #241333;
            border-right: 2px solid #d4af37;
            padding: 25px 15px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 14px 18px;
            margin-bottom: 10px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #68418c;
            color: #ffd700;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            background: rgba(255,255,255,0.96);
            border: 2px solid #d4af37;
            border-radius: 15px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #4b286d;
        }

        img {
            width: 60%;
            max-width: 250px;
        }

        .roll-btn {
            display: inline-block;
            background: #4b286d;
            color: white;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }

        .roll-btn:hover {
            background: #68418c;
            color: #ffd700;
        }

        @media (max-width: 650px) {
            body {
                display: block;
                padding: 0;
            }

            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 2px solid #d4af37;
            }

            .container {
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>
    <nav class="sidebar">
        <h2>⚔️ D&D Menu</h2>

        <a href="{% url 'home' %}" class="active">
            🏠 Home
        </a>

        <a href="{% url 'dice_roller' %}">
            🎲 Dice Roller
        </a>

        <a href="/characters/">🧙 Characters</a>
        <a href="/history/">📜 Roll History</a>
        <a href="/settings/">⚙️ Settings</a>
    </nav>

    <div class="container">
        <h1>Welcome to the D&D Adventure!</h1>

        <img src="https://i.ibb.co/RNB6jpM/welcome.gif"
             alt="Welcome Cartoon">

        <p>Prepare your dice and begin your adventure!</p>

        <a class="roll-btn" href="{% url 'dice_roller' %}">
            🎲 Start Rolling!
        </a>
    </div>
</body>
</html>
