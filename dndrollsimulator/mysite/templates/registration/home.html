
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Dice Roller</title>

    <style>
        body {
            background: linear-gradient(135deg, #241333, #4b286d);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.96);
            border: 2px solid #d4af37;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #4b286d;
            font-weight: bold;
        }

        img {
            width: 60%;
            max-width: 250px;
        }

        .dice-select, .number-input {
            padding: 10px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            font-size: 16px;
            margin: 8px;
        }

        .roll-btn {
            background-color: #4b286d;
            color: white;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .roll-btn:hover {
            background-color: #68418c;
            color: #ffd700;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #f3eafa;
            border-radius: 10px;
            color: #4b286d;
            font-size: 24px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #4b286d;
        }
    </style>
</head>

<body>
    
    <div class="container">
        <h1>Welcome to the D&D Dice Roller!</h1>

        <img src="https://i.ibb.co/RNB6jpM/welcome.gif"
             alt="Welcome Cartoon">

        <p>Prepare your dice and begin your adventure!</p>

        <label class="label" for="dice">Choose your dice</label>
        <select id="dice" class="dice-select">
            <option value="4">D4</option>
            <option value="6">D6</option>
            <option value="8">D8</option>
            <option value="10">D10</option>
            <option value="12">D12</option>
            <option value="20" selected>D20</option>
            <option value="100">D100</option>
        </select>

        <label class="label" for="quantity">Number of dice</label>
        <input id="quantity"
               class="number-input"
               type="number"
               min="1"
               max="20"
               value="1">

        <br>

        <button class="roll-btn" type="button" onclick="rollDice()">
            🎲 Roll Dice!
        </button>

        <div id="result" aria-live="polite">
            Your result will appear here!
        </div>
    </div>

    <script>
        function rollDice() {
            const sides = Number(document.getElementById("dice").value);
            const quantity = Number(document.getElementById("quantity").value);
            const result = document.getElementById("result");

            if (!Number.isInteger(quantity) || quantity < 1 || quantity > 20) {
                result.textContent = "Please choose between 1 and 20 dice.";
                return;
            }

            const rolls = [];

            for (let i = 0; i < quantity; i++) {
                rolls.push(Math.floor(Math.random() * sides) + 1);
            }

            const total = rolls.reduce((sum, roll) => sum + roll, 0);

            result.innerHTML =
                "<div>Rolls: " + rolls.join(", ") + "</div>" +
                "<div style='margin-top:10px'>Total: " + total + "</div>";
        }
    </script>
</body>
</html>
